{# Lumen brand design tokens — light + dark.
   Light is the default. Dark activates with <html data-theme="dark">.
   Colors derived from logo.png (no inventing). #}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    /* DESIGN_LIGHT_MODE.md — Pharma Clean */
    --lumen-ink: #0b1e3a;
    --lumen-ink-soft: #334b69;
    --lumen-mute: #5e6f88;
    --lumen-primary: #1976d2;
    --lumen-blue: #1976d2;
    --lumen-blue-soft: #8ab6e6;
    --lumen-lavender: #e8f2ff;
    --lumen-coral: #1976d2;
    --lumen-coral-soft: #e8f2ff;

    --lumen-paper: #f5f8fc;
    --lumen-paper-2: #eef3fa;
    --lumen-surface: #ffffff;
    --lumen-line: #dbe5f2;
    --lumen-line-2: #e8eef7;

    --lumen-success: #2f9e6e;
    --lumen-warn: #c97819;
    --lumen-danger: #c84b4b;
    --lumen-ok: var(--lumen-success);
    --lumen-err: var(--lumen-danger);
    --lumen-ok-bg: rgba(47, 158, 110, 0.12);
    --lumen-warn-bg: rgba(201, 120, 25, 0.13);

    --lumen-shadow-sm: 0 1px 2px rgba(11, 30, 58, 0.05);
    --lumen-shadow: 0 1px 2px rgba(11, 30, 58, 0.06), 0 8px 24px rgba(11, 30, 58, 0.08);
    --lumen-shadow-lg: 0 1px 2px rgba(11, 30, 58, 0.06), 0 22px 44px rgba(11, 30, 58, 0.1);

    --lumen-r-sm: 2px;
    --lumen-r-md: 4px;
    --lumen-r-lg: 8px;
    --lumen-r: var(--lumen-r-lg);
    --lumen-r-pill: 999px;

    --lumen-s-1: 4px;
    --lumen-s-2: 8px;
    --lumen-s-3: 12px;
    --lumen-s-4: 16px;
    --lumen-s-5: 24px;
    --lumen-s-6: 32px;
    --lumen-s-7: 48px;
    --lumen-s-8: 64px;

    --lumen-font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --lumen-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  [data-theme="dark"] {
    /* DESIGN_DARK_MODE.md — Zed Dev */
    --lumen-ink: #e5e4df;
    --lumen-ink-soft: #b4b2aa;
    --lumen-mute: #7b7a74;
    --lumen-primary: #5fb5d6;
    --lumen-blue: #5fb5d6;
    --lumen-blue-soft: #3f8ba9;
    --lumen-lavender: #2a2d33;
    --lumen-coral: #5fb5d6;
    --lumen-coral-soft: #2a2d33;

    --lumen-paper: #161614;
    --lumen-paper-2: #191917;
    --lumen-surface: #1d1d1b;
    --lumen-line: #2a2a27;
    --lumen-line-2: #242421;

    --lumen-ok-bg: rgba(47, 158, 110, 0.14);
    --lumen-warn-bg: rgba(201, 120, 25, 0.16);

    --lumen-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.38);
    --lumen-shadow: 0 1px 2px rgba(0, 0, 0, 0.42), 0 10px 24px rgba(0, 0, 0, 0.48);
    --lumen-shadow-lg: 0 1px 2px rgba(0, 0, 0, 0.42), 0 24px 50px rgba(0, 0, 0, 0.56);

    --lumen-r-sm: 3px;
    --lumen-r-md: 6px;
    --lumen-r-lg: 10px;
    --lumen-r: var(--lumen-r-lg);
  }

  html, body {
    background: var(--lumen-paper);
    color: var(--lumen-ink);
    font-family: var(--lumen-font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3, h4, h5, h6, code, pre, kbd {
    font-family: var(--lumen-font-mono);
    letter-spacing: -0.015em;
  }

  ::selection {
    background: var(--lumen-lavender);
    color: var(--lumen-ink);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--lumen-line);
    border-radius: 999px;
    border: 2px solid var(--lumen-paper);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--lumen-blue-soft); }

  body, aside, nav, main, .l-card, .l-input, .l-btn, .l-pill {
    transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }

  a {
    color: var(--lumen-primary);
    text-underline-offset: 2px;
  }
  a:hover { opacity: 0.9; }

  button,
  .l-btn,
  [type="button"],
  [type="submit"],
  [type="reset"] {
    font-family: var(--lumen-font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    border-radius: var(--lumen-r-md);
    border: 1px solid transparent;
    background: var(--lumen-primary);
    color: #fff;
    padding: 10px 14px;
    min-height: 40px;
    cursor: pointer;
  }
  button:hover,
  .l-btn:hover,
  [type="button"]:hover,
  [type="submit"]:hover,
  [type="reset"]:hover {
    box-shadow: var(--lumen-shadow);
    transform: translateY(-1px);
  }
  button:disabled,
  .l-btn:disabled,
  [type="button"]:disabled,
  [type="submit"]:disabled,
  [type="reset"]:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  input,
  select,
  textarea,
  .l-input {
    width: 100%;
    min-height: 40px;
    background: var(--lumen-surface);
    color: var(--lumen-ink);
    border: 1px solid var(--lumen-line);
    border-radius: var(--lumen-r-md);
    padding: 10px 12px;
    font-family: var(--lumen-font);
    font-size: 14px;
    line-height: 1.4;
  }
  textarea { min-height: 110px; resize: vertical; }
  input::placeholder,
  textarea::placeholder { color: var(--lumen-mute); }

  input:focus,
  select:focus,
  textarea:focus,
  button:focus,
  .l-btn:focus,
  .l-input:focus {
    outline: none;
    border-color: var(--lumen-primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--lumen-primary) 20%, transparent);
  }

  label {
    display: inline-block;
    margin-bottom: 6px;
    font-family: var(--lumen-font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--lumen-ink-soft);
  }

  fieldset {
    border: 1px solid var(--lumen-line);
    border-radius: var(--lumen-r-md);
    padding: 14px;
    margin: 0;
  }
  legend {
    padding: 0 6px;
    font-family: var(--lumen-font-mono);
    font-size: 11px;
    color: var(--lumen-mute);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--lumen-surface);
    border: 1px solid var(--lumen-line);
    border-radius: var(--lumen-r-md);
    overflow: hidden;
  }
  th, td {
    border-bottom: 1px solid var(--lumen-line-2);
    padding: 10px 12px;
    text-align: left;
    vertical-align: top;
  }
  th {
    font-family: var(--lumen-font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--lumen-ink-soft);
    background: var(--lumen-paper-2);
  }

  .l-card,
  .section,
  .or-card {
    border-radius: var(--lumen-r-lg);
    border: 1px solid var(--lumen-line);
    box-shadow: var(--lumen-shadow-sm);
  }
</style>
